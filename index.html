<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudioLens — Weddings & Videography</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="script.js"></script>
</head>
<body>
<header class="container">
  <nav class="nav">
    <div class="logo">Studio<span>Lens</span></div>
    <a class="cta" href="#contact">Book Now</a>
  </nav>
  <section class="hero">
    <h1>Cinematic Weddings & Timeless Photography</h1>
    <p>We capture the emotions, the beauty, and the story of your special day.</p>
    <div class="hero-cta">
      <a href="#reel" class="btn">Watch Reel</a>
      <a href="#portfolio" class="btn btn-alt">View Portfolio</a>
    </div>
  </section>
</header>

<main>
  <!-- Reel -->
  <section id="reel" class="container reel">
    <h2>Wedding Highlight Reel</h2>
    <div class="video-embed">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"
              frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </section>

  <!-- Portfolio -->
  <section id="portfolio" class="container portfolio">
    <h2>Portfolio</h2>
    <div class="masonry">
      <a href="assets/hero1.jpg" class="item"><img src="assets/hero1_thumb.jpg" alt="Wedding"/></a>
      <a href="https://www.youtube.com/embed/ScMzIvxBSi4" class="item video"><img src="assets/grad1_thumb.jpg" alt="Wedding Video"/></a>
      <a href="assets/fashion1.jpg" class="item"><img src="assets/fashion1_thumb.jpg" alt="Fashion"/></a>
      <a href="https://player.vimeo.com/video/76979871" class="item video"><img src="assets/concert1_thumb.jpg" alt="Concert Video"/></a>
    </div>
    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close">&times;</button>
      <img id="lb-img" alt="preview"/>
      <iframe id="lb-video" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="container contact">
    <h2>Check Availability</h2>
    <form onsubmit="event.preventDefault(); alert('Demo form only');">
      <input type="text" placeholder="Your Name" required/>
      <input type="email" placeholder="Email" required/>
      <textarea rows="4" placeholder="Tell us about your day..."></textarea>
      <button class="btn">Send Request</button>
    </form>
  </section>
</main>

<footer class="container footer">
  <p>© <span id="year"></span> StudioLens — All rights reserved.</p>
</footer>
</body>
</html>
